<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style id="UNIVERSAL_ANY_SCREEN">
/* Base - keep original scrolling fully working */
html, body { background:#fdf2f8!important; }

/* Force 4 columns on tablet and TV so you can drag between tabs */
@media (min-width: 800px) {
  div[class*="grid-cols"] {
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 8px !important;
  }
}

/* For phones, keep 1 column so it's usable */
@media (max-width: 799px) {
  div[class*="grid-cols"] {
    grid-template-columns: repeat(1, 1fr) !important;
  }
}

/* Modern browsers - use zoom to fit 4 cols (doesn't break scroll) */
@media (min-width: 1280px) {
  html { zoom: 0.85; }
}
@media (min-width: 768px) and (max-width: 1279px) {
  html { zoom: 0.92; }
}
</style>
<script>
// UNIVERSAL FALLBACK for Onn TV apps like TV Bro that ignore zoom
(function(){
  var supportsZoom = CSS && CSS.supports && CSS.supports('zoom','1');
  if (!supportsZoom) {
    // TV Bro fallback - use transform scale but keep scrolling
    var isTV = window.innerWidth >= 1280;
    var isTablet = window.innerWidth >= 768 && window.innerWidth < 1280;
    var scale = isTV ? 0.78 : (isTablet ? 0.75 : 1);
    if (scale < 1) {
      var root = document.getElementById('root');
      if (root) {
        root.style.transform = 'scale(' + scale + ')';
        root.style.transformOrigin = 'top left';
        root.style.width = (100 / scale) + '%';
        // Don't lock height - let body scroll
        document.body.style.overflow = 'auto';
        document.documentElement.style.overflow = 'auto';
      }
    }
  }
})();
</script>

}
